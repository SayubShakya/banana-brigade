# Continuous integration for Banana Brigade.
# On every push and pull request: install the exact packages from package-lock.json,
# run the automated tests (they start a throw-away MongoDB with mongodb-memory-server,
# which downloads a MongoDB binary on the runner) and build the React app with Vite.
#
# Written with help from a generative AI coding assistant; reviewed by Sayub Shakya.

name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Download MongoDB into the cached folder (by default it goes under node_modules,
      # which npm ci deletes, so the cache would never be used).
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # mongodb-memory-server downloads a MongoDB binary into this folder on the
      # first run; caching it makes later runs faster and less dependent on the download.
      - name: Cache the MongoDB binary for the tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install packages
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Build the React app
        run: npx vite build

  # End-to-end: a real browser (Chromium) registers, logs in, starts Quick Play and
  # solves a puzzle against the app with an in-memory MongoDB and a fake Banana API.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install packages
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the React app
        run: npx vite build

      - name: Run the end-to-end tests
        run: npx playwright test

      - name: Keep the report if a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
