# Written with help from Claude (Anthropic), an AI coding assistant; reviewed by Sayub Shakya.

name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache the MongoDB binary for the tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install packages
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Build the React app
        run: npx vite build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install packages
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the React app
        run: npx vite build

      - name: Run the end-to-end tests
        run: npx playwright test

      - name: Keep the report if a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
