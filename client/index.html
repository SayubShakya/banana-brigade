<!DOCTYPE html>
<!-- Banana Brigade: a doodle-army style jetpack shooter. Banana API puzzles unlock
     deployment, respawns and banana crates. React draws the menus and screens into
     #ui; the battle canvas and HUD below are plain HTML that the game engine updates
     60 times a second without React.
     Written with help from a generative AI coding assistant; reviewed by Sayub Shakya. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Banana Brigade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-cross" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 1v6M12 17v6M1 12h6M17 12h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-team" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16.5" cy="8.5" r="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M2 20c0-3.6 2.7-6 6-6s6 2.4 6 6M13 14.4c.9-.3 2.2-.4 3.5-.4 3 0 5.5 2 5.5 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-banana" viewBox="0 0 24 24"><path d="M4 6c1 7 6 12 15 12-1.2 2-3.8 3-7 3C6 21 2.5 15.5 3 6z" fill="currentColor"/><path d="M3 6 4.6 4.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M3.5 21c0-4.4 3.8-7.4 8.5-7.4s8.5 3 8.5 7.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v6a5 5 0 0 1-10 0z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M7 5H3.5c0 3 1.5 5 3.8 5.4M17 5h3.5c0 3-1.5 5-3.8 5.4M12 14v4M8 21h8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-helmet" viewBox="0 0 24 24"><path d="M3 15a9 9 0 0 1 18 0v1H3z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M1.5 16.5h21M9 7.5v4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M4 10l8-5 8 5v4l-8-5-8 5zM4 17l8-5 8 5v3l-8-5-8 5z" fill="currentColor"/></symbol>
  </svg>

    <div id="stage">
    <!-- ============ Battle (canvas and HUD, drawn by the game engine, not React) ============ -->
    <section id="screen-battle" class="screen battle" hidden>
      <canvas id="battle-canvas" aria-label="Battlefield"></canvas>
      <div id="hud">
        <div class="hud-player">
          <canvas id="hud-avatar" width="60" height="80" aria-hidden="true"></canvas>
          <div class="bars">
            <div class="bar health" title="Health"><div id="hp-fill" class="fill good"></div><span id="hp-text">100</span></div>
            <div class="bar fuel" title="Jetpack fuel"><div id="fuel-fill" class="fill"></div><span>JET</span></div>
          </div>
        </div>

        <div class="hud-center">
          <div id="timer">5:00</div>
          <div id="killfeed" aria-live="polite"></div>
        </div>

        <div class="hud-score">
          <div class="score-pill">
            <div id="score">Kills 0 · Deaths 0</div>
            <div id="rank"></div>
          </div>
          <button class="hud-btn round" data-action="pause" aria-label="Pause">II</button>
        </div>

        <button id="crate-prompt" class="crate-prompt" data-action="pickup" hidden></button>

        <div class="hud-weapons">
          <div class="weapon-panel">
            <div id="weapon-name">Magnum</div>
            <div id="ammo">8 / ∞</div>
            <div class="reload-bar" id="reload-bar"><div id="reload-fill"></div></div>
          </div>
          <div class="action-buttons">
            <button class="hud-btn" data-action="swap" title="Switch weapon (Q)">SWAP <kbd>Q</kbd></button>
            <button class="hud-btn" data-action="reload" title="Reload (R)">RELOAD <kbd>R</kbd></button>
            <button class="hud-btn" data-action="melee" title="Melee (F)">MELEE <kbd>F</kbd></button>
            <button class="hud-btn" data-action="grenade" title="Grenade (G)">NADE <b id="grenades">3</b> <kbd>G</kbd></button>
            <button class="hud-btn" data-action="zoom" title="Zoom (Z)">ZOOM <b id="zoom-label">1x</b> <kbd>Z</kbd></button>
          </div>
        </div>

        <div id="stick-move" class="stick left" aria-hidden="true"><div class="knob"></div></div>
        <div id="stick-aim" class="stick right" aria-hidden="true"><div class="knob"></div></div>

        <div id="center-msg" role="button" tabindex="0" hidden></div>
        <div id="hud-toast" role="status"></div>
        <div id="hud-help" class="hud-help" hidden>
          <span><kbd>A</kbd><kbd>D</kbd> move</span><span><kbd>W</kbd> / <kbd>Space</kbd> jetpack</span><span><kbd>Mouse</kbd> aim · <kbd>Click</kbd> shoot</span>
          <span class="banana"><kbd>E</kbd> open banana crate</span><span class="banana"><kbd>B</kbd> Banana respawn</span><span><kbd>Esc</kbd> menu</span>
        </div>
        <div id="fps" class="fps" hidden></div>
        <div id="hit-flash"></div>

        <div id="scoreboard" hidden>
          <h3>Scoreboard</h3>
          <table><thead><tr><th>#</th><th>Soldier</th><th>Kills</th><th>Deaths</th></tr></thead><tbody id="scoreboard-body"></tbody></table>
        </div>
      </div>
    </section>

    <div id="ui"></div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
